groups:
  - name: supportops-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{service="api",status=~"5.."}[2m])) / sum(rate(http_requests_total{service="api"}[2m])) > 0.05
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Taux d'erreurs 5xx supérieur à 5% sur le service backend"
          grafana_url: "http://localhost:3000/d/supportops-overview"

      - alert: BackendServiceDown
        expr: up{job="supportops-backend"} == 0
        for: 30s
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Le service backend est indisponible"
          grafana_url: "http://localhost:3000/d/supportops-overview"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[2m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Latence P95 supérieure à 500ms sur l'API"
          grafana_url: "http://localhost:3000/d/supportops-overview"

  - name: supportops-storage
    rules:
      - alert: PersistentVolumeAlmostFull
        expr: |
          kubelet_volume_stats_available_bytes{namespace="supportops"}
            / kubelet_volume_stats_capacity_bytes{namespace="supportops"} < 0.15
        for: 5m
        labels:
          severity: warning
          service: storage
        annotations:
          summary: "Volume {{ $labels.persistentvolumeclaim }} rempli à plus de 85 %"
          grafana_url: "http://localhost:3000/d/supportops-overview"

      - alert: PersistentVolumeFillingUp
        expr: |
          predict_linear(kubelet_volume_stats_available_bytes{namespace="supportops"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: critical
          service: storage
        annotations:
          summary: "Volume {{ $labels.persistentvolumeclaim }} plein dans moins de 24 h au rythme actuel"
          grafana_url: "http://localhost:3000/d/supportops-overview"
