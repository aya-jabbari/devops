server {
  listen 80;
  root /usr/share/nginx/html;
  # Resolve the API at request time, not at startup: nginx no longer exits with
  # "host not found in upstream" when cluster DNS is not ready yet (node reboot).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
  location /api/ {
    set $api_upstream ${API_HOST}:8000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
  }
  location / { try_files $uri /index.html; }
}
