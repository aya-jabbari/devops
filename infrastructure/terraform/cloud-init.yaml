#cloud-config
# Installs a single-node K3s server on first boot. No manual step.
# Traefik (bundled with K3s) stays enabled: it is our Ingress controller.
package_update: true
packages:
  - curl
  - ca-certificates

runcmd:
  - |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="${k3s_version}" \
      INSTALL_K3S_EXEC="server --tls-san ${public_ip} --write-kubeconfig-mode 0644" \
      sh -
  - until kubectl get nodes 2>/dev/null | grep -q " Ready"; do sleep 5; done
  - touch /var/lib/k3s-ready
