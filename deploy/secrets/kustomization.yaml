# Built by Argo CD (Application supportops-secrets) with the KSOPS plugin:
# the generator decrypts supportops-secrets.enc.yaml with the Age key mounted in argocd-repo-server.
# Local check (needs ksops in PATH and the Age key):
#   kubectl kustomize --enable-alpha-plugins --enable-exec deploy/secrets
# The *.example.yaml file is NOT listed: it is never deployed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generators:
  - ./secret-generator.yaml
