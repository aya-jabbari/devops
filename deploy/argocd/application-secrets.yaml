# Argo CD Application for the encrypted Secret supportops-secrets (decrypted in the cluster by KSOPS).
# Separate from the Helm Application: the chart never holds secrets, and this one only builds deploy/secrets.
# Needs: deploy/argocd/ksops-repo-server-patch.yaml applied and the sops-age Secret (scripts/argocd-age-key.sh).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supportops-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aya-jabbari/devops.git
    targetRevision: main
    path: deploy/secrets          # kustomization.yaml + KSOPS generator
  destination:
    server: https://kubernetes.default.svc
    namespace: supportops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true              # a Secret edited by hand is reverted to the decrypted Git version
    syncOptions:
      - CreateNamespace=true
