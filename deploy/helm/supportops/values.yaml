# Defaults. Environment-specific values live in deploy/environments/.
# No secret here: credentials come from an existing Secret (SOPS + age, see docs).

backendImage:
  repository: ghcr.io/aya-jabbari/supportops-backend   # adjust to the real GHCR path
  tag: dev                                             # CI sets the commit SHA (or digest)
  pullPolicy: IfNotPresent

# Secret created outside the chart (SOPS-encrypted). Expected keys:
#   DATABASE_URL, SECRET_KEY, ALERTMANAGER_WEBHOOK_SECRET
secrets:
  existingSecret: supportops-secrets

config:
  smtpHost: mailpit
  smtpPort: "1025"
  overdueCheckSeconds: "300"
  notificationMaxRetries: "3"

# PostgreSQL. Credentials come from the existing Secret (keys POSTGRES_USER,
# POSTGRES_PASSWORD, POSTGRES_DB), never from values.
postgres:
  image: postgres:17-alpine
  persistence:
    enabled: true          # false = emptyDir (Kind/k3d tests, data lost with the pod)
    size: 5Gi
    storageClass: ""       # "" = cluster default (local-path on K3s)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

mailpit:
  image: axllent/mailpit:v1.32.0
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

redis:
  image: redis:8-alpine
  persistence:
    enabled: true          # false = no volume (Kind/k3d tests, queue lost with the pod)
    size: 1Gi
    storageClass: ""       # "" = cluster default (local-path on K3s)
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 192Mi }

worker:
  replicas: 1
  concurrency: 2
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 384Mi }

# Exactly ONE scheduler: two Beats would duplicate every periodic check.
scheduler:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

serviceMonitor:
  enabled: false
  interval: 30s

frontendImage:
  repository: ghcr.io/aya-jabbari/supportops-frontend
  tag: dev
  pullPolicy: IfNotPresent

api:
  replicas: 1
  imageTag: ""            # empty = backendImage.tag; set it to roll out only the API
  rollout:
    enabled: false        # true = Argo Rollouts canary instead of a plain Deployment
    steps:
      - setWeight: 20
      - pause: {}         # waits for a manual "promote" until the AnalysisTemplate is wired
      - setWeight: 50
      - pause: { duration: 30s }
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 384Mi }

frontend:
  replicas: 1
  apiHost: api            # nginx proxies /api/ to this Service
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

ingress:
  enabled: true
  className: nginx        # K3s ships Traefik: set "traefik" in the prod values
  host: ""                # empty = match any host (http://localhost on Kind)
  annotations: {}
