# Defaults. Environment-specific values live in deploy/environments/.
# No secret here: credentials come from an existing Secret (SOPS + age, see docs).

backendImage:
  repository: ghcr.io/aya-jabbari/supportops-backend   # adjust to the real GHCR path
  tag: dev                                             # CI sets the commit SHA (or digest)
  pullPolicy: IfNotPresent

# Secret created outside the chart (SOPS-encrypted). Expected keys:
#   DATABASE_URL, SECRET_KEY, ALERTMANAGER_WEBHOOK_SECRET
secrets:
  existingSecret: supportops-secrets

config:
  smtpHost: mailpit
  smtpPort: "1025"
  overdueCheckSeconds: "300"
  notificationMaxRetries: "3"

redis:
  image: redis:8-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 192Mi }

worker:
  replicas: 1
  concurrency: 2
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 384Mi }

# Exactly ONE scheduler: two Beats would duplicate every periodic check.
scheduler:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

serviceMonitor:
  enabled: false
  interval: 30s

# Persistence for PostgreSQL. false = emptyDir (Kind/tests without a StorageClass).
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""        # empty = cluster default StorageClass

postgres:
  image: postgres:17-alpine
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

mailpit:
  image: axllent/mailpit:v1.32.0
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

frontendImage:
  repository: ghcr.io/aya-jabbari/supportops-frontend
  tag: dev
  pullPolicy: IfNotPresent

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 384Mi }

frontend:
  replicas: 1
  apiHost: api            # nginx proxies /api/ to this Service
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }
