{{- $imageTag := .Values.api.imageTag | default .Values.backendImage.tag }}
{{- if .Values.api.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: api
  labels:
    {{- include "supportops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "supportops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  {{- if .Values.api.rollout.enabled }}
  strategy:
    canary:
      steps:
        {{- toYaml .Values.api.rollout.steps | nindent 8 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "supportops.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 64Mi }
      containers:
        - name: api
          image: {{ .Values.backendImage.repository }}:{{ $imageTag }}
          imagePullPolicy: {{ .Values.backendImage.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            {{- include "supportops.backendEnv" . | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "supportops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "supportops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 8000, targetPort: http }
