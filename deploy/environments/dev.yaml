# Overrides for the demo/dev cluster. Usage:
#   helm upgrade --install supportops deploy/helm/supportops -f deploy/environments/dev.yaml
backendImage:
  tag: dev
postgres:
  persistence:
    size: 2Gi          # matches the volume already created on Kind
api:
  replicas: 5             # 20% of 5 = exactly 1 canary pod
  imageTag: v4
  rollout:
    enabled: true
