# Overrides for the real infrastructure (single K3s node on AWS EC2, see infrastructure/terraform/).
#   helm upgrade --install supportops deploy/helm/supportops -f deploy/environments/prod.yaml \
#     --set backendImage.tag=<commit-sha> --set frontendImage.tag=<commit-sha>
# No secret here: supportops-secrets is applied from deploy/secrets/ (SOPS + Age).
# Written with Aya (data/persistence) ; Doha owns the rest of the chart. Sizes to confirm on the real VM.
backendImage:
  repository: ghcr.io/aya-jabbari/supportops-backend
  tag: 331bb7a9825f3e7b42b99249cf2b92fe7cf3e830
  pullPolicy: IfNotPresent

postgres:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path         # K3s default; single node, so the volume is local to the VM
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { cpu: 750m, memory: 768Mi }

redis:
  persistence:
    enabled: true
    size: 2Gi
    storageClass: local-path

worker:
  replicas: 1
  concurrency: 2

frontendImage:
  repository: ghcr.io/aya-jabbari/supportops-frontend
  tag: 331bb7a9825f3e7b42b99249cf2b92fe7cf3e830
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik                 # K3s ships Traefik (no nginx ingress controller)
  host: ""                           # no domain yet: match any host on the Elastic IP

# --- API / progressive delivery (Doha) ---
api:
  replicas: 2
  rollout:
    # TODO(Doha/Aya): switch to true ONLY once Argo Rollouts (CRDs + controller)
    # and Prometheus are installed on the K3s node. With true and no CRD,
    # the sync fails on "no matches for kind Rollout".
    enabled: false
    analysis:
      enabled: true
      # TODO: confirm with Aya where Prometheus runs on the VM. Placeholder:
      prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
      threshold: 0.02

# Only if kube-prometheus-stack is installed on K3s (needs the ServiceMonitor CRD).
serviceMonitor:
  enabled: false
